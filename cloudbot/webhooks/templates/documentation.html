<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBot Commands Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        .search-highlight {
            background-color: #fef08a;
        }
        .dark .search-highlight {
            background-color: #a16207;
            color: #fef3c7;
        }
        .command-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .command-card-body {
            flex: 1;
        }
        .copy-notification {
            animation: fadeInOut 2s ease-in-out;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(-10px); }
            20%, 80% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300"
      x-data="documentationApp()"
      x-init="init()">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-robot text-2xl text-primary-600 dark:text-primary-400"></i>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">CloudBot Commands</h1>
                    <span class="text-sm text-gray-500 dark:text-gray-400" x-text="`${filteredCommands.length} commands`"></span>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Search -->
                    <div class="relative">
                        <input
                            type="text"
                            x-model="searchQuery"
                            placeholder="Search commands..."
                            class="w-64 pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        >
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>


                    <!-- Theme Toggle -->
                    <button
                        @click="toggleTheme()"
                        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                    >
                        <i class="fas fa-sun text-yellow-500 dark:hidden"></i>
                        <i class="fas fa-moon text-blue-400 hidden dark:inline"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex flex-wrap items-center gap-4">
            <!-- Status Filter -->
            <div class="flex items-center space-x-2">
                <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Status:</label>
                <select x-model="statusFilter" class="border border-gray-300 dark:border-gray-600 rounded-md px-3 py-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    <option value="">All</option>
                    <option value="functional">Functional</option>
                    <option value="broken">Broken</option>
                </select>
            </div>

            <!-- Plugin Filter -->
            <div class="flex items-center space-x-2">
                <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Plugin:</label>
                <select x-model="pluginFilter" class="border border-gray-300 dark:border-gray-600 rounded-md px-3 py-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    <option value="">All Plugins</option>
                    <template x-for="plugin in uniquePlugins" :key="plugin">
                        <option :value="plugin" x-text="plugin"></option>
                    </template>
                </select>
            </div>

            <!-- Clear Filters -->
            <button
                @click="clearFilters()"
                class="px-3 py-1 text-sm text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 font-medium"
            >
                Clear Filters
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
        <!-- No Results -->
        <div x-show="filteredCommands.length === 0" class="text-center py-12">
            <i class="fas fa-search text-4xl text-gray-400 mb-4"></i>
            <h3 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-2">No commands found</h3>
            <p class="text-gray-500 dark:text-gray-400">Try adjusting your search or filters</p>
        </div>

        <!-- Commands Grid -->
        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" x-show="filteredCommands.length > 0">
            <template x-for="command in filteredCommands" :key="command.name">
                <div class="command-card bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-lg transition-shadow border border-gray-200 dark:border-gray-700">
                    <!-- Command Header -->
                    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                        <div class="flex items-start justify-between">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-2">
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white"
                                        x-html="highlightSearch(command.name)"></h3>

                                    <!-- Copy Command Button -->
                                    <button
                                        @click="copyCommand(command.name)"
                                        class="p-1 text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors"
                                        title="Copy command"
                                    >
                                        <i class="fas fa-copy text-sm"></i>
                                    </button>
                                </div>

                                <!-- Command Example -->
                                <div class="mb-2">
                                    <code class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-2 py-1 rounded font-mono"
                                          x-text="getCommandPrefix() + command.name"></code>
                                </div>

                                <!-- Aliases -->
                                <div x-show="command.aliases.length > 0" class="mt-1">
                                    <span class="text-xs text-gray-500 dark:text-gray-400">Aliases: </span>
                                    <template x-for="alias in command.aliases" :key="alias">
                                        <span class="inline-block px-2 py-1 text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded mr-1"
                                              x-text="alias"></span>
                                    </template>
                                </div>
                            </div>

                            <!-- Status Badge -->
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium flex-shrink-0"
                                  :class="command.status === 'functional' ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300'">
                                <i class="fas fa-circle text-xs mr-1"
                                   :class="command.status === 'functional' ? 'text-green-400' : 'text-red-400'"></i>
                                <span x-text="command.status"></span>
                            </span>
                        </div>
                    </div>

                    <!-- Command Body -->
                    <div class="command-card-body p-4">
                        <!-- Plugin Info -->
                        <div class="flex items-center text-sm text-gray-500 dark:text-gray-400 mb-3">
                            <i class="fas fa-puzzle-piece mr-2"></i>
                            <span x-text="command.plugin_name"></span>
                        </div>

                        <!-- Documentation -->
                        <div x-show="command.docstring">
                            <p class="text-sm text-gray-700 dark:text-gray-300"
                               x-html="highlightSearch(command.docstring || '')"></p>
                        </div>

                        <!-- No Documentation -->
                        <div x-show="!command.docstring">
                            <p class="text-sm text-gray-500 dark:text-gray-400 italic">No documentation available</p>
                        </div>
                    </div>

                    <!-- Command Footer -->
                    <div class="px-4 py-3 bg-gray-50 dark:bg-gray-700/50 rounded-b-lg border-t border-gray-200 dark:border-gray-600">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500 dark:text-gray-400">
                                Function: <code class="text-xs bg-gray-200 dark:bg-gray-600 px-1 rounded" x-text="command.function_name"></code>
                            </span>

                            <!-- GitHub Link -->
                            <a :href="getGithubUrl(command)"
                               target="_blank"
                               class="inline-flex items-center text-xs text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 font-medium">
                                <i class="fab fa-github mr-1"></i>
                                Source
                            </a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Floating Copy Notification -->
    <div x-show="copyNotification"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-x-full"
         x-transition:enter-end="opacity-100 transform translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-x-0"
         x-transition:leave-end="opacity-0 transform translate-x-full"
         class="fixed top-20 right-4 z-50 px-4 py-3 bg-green-500 dark:bg-green-600 text-white rounded-lg shadow-lg flex items-center space-x-2 font-medium">
        <i class="fas fa-check text-green-100"></i>
        <span>Command copied!</span>
    </div>

    <script>
        function documentationApp() {
            return {
                commands: {{ commands | tojson }},
                searchQuery: '',
                statusFilter: '',
                pluginFilter: '',
                theme: 'light',
                copyNotification: false,
                commandPrefix: '{{ command_prefix }}',

                get filteredCommands() {
                    return this.commands.filter(command => {
                        const matchesSearch = !this.searchQuery ||
                            command.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            command.function_name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            (command.docstring && command.docstring.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                            command.aliases.some(alias => alias.toLowerCase().includes(this.searchQuery.toLowerCase()));

                        const matchesStatus = !this.statusFilter || command.status === this.statusFilter;
                        const matchesPlugin = !this.pluginFilter || command.plugin_name === this.pluginFilter;

                        return matchesSearch && matchesStatus && matchesPlugin;
                    });
                },

                get uniquePlugins() {
                    return [...new Set(this.commands.map(cmd => cmd.plugin_name))].sort();
                },

                init() {
                    // Initialize theme from localStorage
                    this.theme = localStorage.getItem('theme') || 'light';
                    this.applyTheme();
                },

                toggleTheme() {
                    this.theme = this.theme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('theme', this.theme);
                    this.applyTheme();
                },

                applyTheme() {
                    if (this.theme === 'dark') {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                clearFilters() {
                    this.searchQuery = '';
                    this.statusFilter = '';
                    this.pluginFilter = '';
                },

                getCommandPrefix() {
                    return this.commandPrefix;
                },

                async copyCommand(commandName) {
                    const fullCommand = this.commandPrefix + commandName;
                    try {
                        await navigator.clipboard.writeText(fullCommand);
                        this.showCopyNotification();
                    } catch (err) {
                        // Fallback for older browsers
                        const textArea = document.createElement('textarea');
                        textArea.value = fullCommand;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        this.showCopyNotification();
                    }
                },

                showCopyNotification() {
                    this.copyNotification = true;
                    setTimeout(() => {
                        this.copyNotification = false;
                    }, 2000);
                },

                highlightSearch(text) {
                    if (!this.searchQuery || !text) return text;

                    const regex = new RegExp(`(${this.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    return text.replace(regex, '<span class="search-highlight">$1</span>');
                },

                getGithubUrl(command) {
                    const repoLink = '{{ repo_link }}';
                    const relativePath = command.file_path.replace('{{ plugins_dir }}/', '');
                    let url = `${repoLink}/blob/master/${relativePath}`;

                    if (command.line_number) {
                        url += `#L${command.line_number}`;
                    }

                    return url;
                }
            }
        }
    </script>
</body>
</html>
