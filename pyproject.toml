[tool.isort]
line_length = 80
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
known_first_party = ["cloudbot", "plugins", "tests"]
float_to_top = true

[dependency-groups]
dev = [
    "freezegun==1.4.0",
    "mypy==1.9.0",
    "pre-commit==3.3.3",
    "pylint==3.1.0",
    "pytest==8.1.1",
    "pytest-asyncio==0.20.3",
    "pytest-cov==4.1.0",
    "pytest-random-order==1.1.1",
    "pytest-pythonhashseed==1.0.1",
    "responses==0.25.0",
    "typing-extensions>=4.12.2",
    "types-requests~=2.32.4.20250611",
    "types-pytz>=2024.1",
    "types-cachetools>=7.0.0",
]

[tool.black]
line-length = 80
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv
  )/
)
'''

[tool.uv]
package = false

[tool.pylint.main]
py-version = "3.10"
extension-pkg-allow-list=["lxml"]
max-module-lines = 2000
ignored-modules = [
  "agents",
  "agents.exceptions",
  "agents.models.openai_chatcompletions",
  "agents.models.openai_provider",
  "agents.run",
  "asyncwhois",
  "chartlyrics",
  "chartlyrics.lyrics",
  "chatbot",
  "cleverwrap",
  "curl_cffi",
  "dictcc",
  "enchant",
  "enchant.checker",
  "enchant.tokenize",
  "ety",
  "feedparser",
  "freezegun",
  "fuzzywuzzy",
  "gazpacho",
  "github",
  "google.transliteration",
  "google.transliteration.numerals",
  "google_play_scraper",
  "googlemaps",
  "googlemaps.exceptions",
  "humanfriendly",
  "imgurpython",
  "irclib.parser",
  "irclib.util.compare",
  "isodate",
  "lightstreamer.client",
  "magic",
  "markitdown",
  "mcstatus",
  "mcstatus.status_response",
  "mediawiki",
  "microdata",
  "mwparserfromhell",
  "natsort",
  "newsapi",
  "nltk",
  "openai",
  "openrouter",
  "openrouter.components.model",
  "openrouter.errors",
  "pyocr.builders",
  "pyproj",
  "pypdf",
  "pywikibot",
  "pywikibot.exceptions",
  "pyyoutube",
  "responses",
  "responses.matchers",
  "streetview",
  "timezonefinder",
  "unidecode",
  "uwuipy",
  "validators",
  "watchdog.events",
  "watchdog.observers",
  "youtube_search",
  "youtube_transcript_api",
]

[tool.pylint.messages_control]
disable = [
  "raw-checker-failed",
  "no-else-return",
  "nested-min-max",
  "bad-mcs-classmethod-argument",
  "bad-inline-option",
  "locally-disabled",
  "file-ignored",
  "suppressed-message",
  "useless-suppression",
  "deprecated-pragma",
  "use-symbolic-message-instead",
  "invalid-name",
  "duplicate-string-formatting-argument",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "consider-using-f-string",
  "consider-using-dict-items",
  "consider-using-with",
  "consider-using-min-builtin",
  "arguments-renamed",
  "use-maxsplit-arg",
  "consider-iterating-dictionary",
  "redefined-outer-name",
  "unused-argument",
  "broad-except",
  "ungrouped-imports",
  "wrong-import-position",
  "arguments-differ",
  "too-many-arguments",
  "too-many-locals",
  "too-many-statements",
  "too-many-branches",
  "protected-access",
  "duplicate-code",
  "no-else-raise",
  "arguments-out-of-order",
  "redefined-builtin",
  "no-else-continue",
  "unnecessary-comprehension",
  "no-value-for-parameter",
  "too-few-public-methods",
  "fixme",
  "too-many-public-methods",
  "missing-timeout",
  "not-callable",
  "unnecessary-lambda-assignment",
  "abstract-method",
  "abstract-class-instantiated",
  "consider-using-generator",
  "too-many-return-statements",
  "line-too-long",
  "too-many-instance-attributes",
  "broad-exception-raised",
  "use-implicit-booleaness-not-comparison",
  # cloudbot/agent/subagent.py imports plugins.agent for _make_run_config, so
  # cloudbot.agent <-> plugins.agent is cyclic by design and broken at runtime by
  # deferred imports. pylint counts deferred imports too, and reports this at an
  # arbitrary module, so it cannot be suppressed locally.
  "cyclic-import",
]

enable = ["c-extension-no-member"]

[tool.pylint.typecheck]
generated-members = "(requests\\.)?codes\\.[a-zA-Z0-9_]+"

[tool.mypy]
namespace_packages = true
python_version = "3.10"
warn_unused_configs = true
strict = false
strict_optional = false
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = 'cloudbot.*'
check_untyped_defs = true
warn_return_any = true
